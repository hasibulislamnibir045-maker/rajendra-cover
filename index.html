 if(t.k==='dbl')s=R(24,24,746,1074,c1,3)+R(32,32,730,1058,c2,1);
 if(t.k==='band')s=F(0,0,794,14,c1)+F(0,14,794,3,c2)+F(0,1108,794,14,c1)+F(0,1105,794,3,c2)+R(30,34,734,1054,c1,1.2);
 if(t.k==='corner'){s=R(34,34,726,1054,c2,1);[[24,24,1,1],[770,24,-1,1],[24,1098,1,-1],[770,1098,-1,-1]].forEach(q=>s+=`<path d="M${q[0]} ${q[1]+q[3]*80}V${q[1]}H${q[0]+q[2]*80}" fill="none" stroke="${c1}" stroke-width="5"/>`)}
 if(t.k==='side')s=F(0,0,26,1122,c1)+F(32,0,4,1122,c2)+R(44,24,726,1074,c1,1.2);
 return `<svg width="794" height="1122" viewBox="0 0 794 1122">${s}</svg>`}
function fitText(){const tp=document.querySelector('#pg .tp'),tt=tp&&tp.firstElementChild;if(!tt)return;let fs=27;tt.style.fontSize=fs+'px';
 while(tt.offsetHeight>tp.clientHeight-20&&fs>12){fs--;tt.style.fontSize=fs+'px'}}
function render(){
 const t=TPL[tpl],c1=$('color').value,v=i=>$(i).value.trim(),l=$('lang').value,dk=$('dept').value,db=DEPT[dk];
 const pg=$('pg');pg.style.cssText=`--c1:${c1};--c2:${t.c2};--paper:${t.p};--ink:${t.ink};--ht:${t.ht};--ff:'${$('font').value}'`;
 const dn=l==='en'?dk:l==='bn'?db:dk+' | '+db;
 const oth=$('clg').value==='o';$('oc').style.display=oth?'block':'none';$('rd').style.display=oth?'none':'block';$('rl').style.display=oth?'none':'block';
 const cname=esc(v('ocn')||'Your College Name'),dnn=oth?(v('ocd')||'Department'):dn,dshort=oth?dnn:(l==='bn'?db:dk);
 const yi=$('year').selectedIndex,prog=l==='bn'?PROGBN[$('prog').value]:$('prog').value,yr=l==='bn'?YRBN[yi]:$('year').value;
 const dc=l==='en'?$('doc').value:l==='bn'?DOCBN[$('doc').value]:$('doc').value+' | '+DOCBN[$('doc').value];
 const dl=l==='bn'?L.bn.dept:L.en.dept;
 let to='';if(v('toName'))to+=`<b>${esc(v('toName'))}</b><br>`;
 to+=esc(v('toDesig')||'Head of the Department')+'<br>'+dl+esc(dshort)+'<br>'+(oth?cname:(l==='bn'?L.bn.col:L.en.col));
 let by=`<b>${esc(v('name')||'Your Name')}</b><br>${T('roll')}: ${esc(bd(v('roll')||'—'))}<br>`;
 if(v('reg'))by+=`${T('reg')}: ${esc(bd(v('reg')))}<br>`;if(v('sid'))by+=`${T('sid')}: ${esc(bd(v('sid')))}<br>`;
 by+=esc(prog)+' '+esc(yr)+`<br>${T('sess')}: ${esc(bd(v('sess')||'—'))}`;if(v('ph'))by+=`<br>${T('ph')}: ${esc(bd(v('ph')))}`;
 const phS=oth?ocPhoto:photoSrc,hasPh=$('showPh').checked&&phS,side=t.k==='side';
 const pl=side?50:40,pw=754-pl;
 const ph=hasPh?`<div class="pw" style="left:${pl}px;width:${pw}px"><img src="${phS}" onerror="this.parentNode.remove()"></div>`:'';
 const lsrc=oth?ocLogo:logoSrc,lg=lsrc?`<img src="${lsrc}">`:crest(c1,t.c2);
 const nl=oth?'':(nuSrc?`<img src="${nuSrc}">`:nuMark(c1,t.c2));
 const left=side?96:70,right=70;
 pg.innerHTML=deco(t,c1)+ph+`<div class="ct" style="left:${left}px;right:${right}px;bottom:${hasPh?272:64}px">
 <div class="nu">${oth?'':`<span class="nl">${nl}</span>`}<span>${oth?esc(v('ocu')||'University'):(l==='bn'?L.bn.aff:two(L.en.aff,L.bn.aff).replace(/<br>.*$/,''))}</span></div>
 <div class="g"><div class="lw">${lg}</div><div class="cn">${oth?cname:two(L.en.col,L.bn.col)}</div></div>
 <div class="g"><div class="rb">${dl}${esc(dnn)}</div>
 ${v('ccode')?`<div class="sm"><b>${T('code')}:</b> ${esc(bd(v('ccode')))}</div>`:''}${v('ctitle')?`<div class="sm"><b>${T('ct')}:</b> ${esc(v('ctitle'))}</div>`:''}</div>
 <div class="g"><div class="dt">${esc(dc)}</div><div class="sm" style="font-weight:700">${T('on')}</div>
 <div class="tp"><span class="tt">&ldquo;${esc(v('topic')||'Your topic will appear here')}&rdquo;</span></div></div>
 <div class="bx"><div class="b"><h4>${T('to')}</h4><div>${to}</div></div><div class="b"><h4>${T('by')}</h4><div>${by}</div></div></div>
 <div class="ft">${T('date')}: ${esc(fdate($('date').value))}</div></div>`;
 fitText();
 try{localStorage.setItem('rsh3',JSON.stringify({tpl,f:[...document.querySelectorAll('input:not([type=file]),select')].map(e=>e.type==='checkbox'?e.checked:e.value)}))}catch(e){}}
function fitP(){const s=Math.min(1,$('fit').clientWidth/794);$('pg').style.transform=`scale(${s})`;$('fit').style.height=1122*s+'px'}
function pick(i,setColor=true){tpl=i;if(setColor)$('color').value=TPL[i].c1;document.querySelectorAll('.tb').forEach((b,j)=>b.classList.toggle('on',j===i));render()}
$('tg').innerHTML=TPL.map((t,i)=>`<button class="tb" onclick="pick(${i})"><i style="background:linear-gradient(135deg,${t.p} 38%,${t.c1} 38%,${t.c1} 70%,${t.c2} 70%)"></i>${t.n}</button>`).join('');
$('dept').innerHTML=Object.keys(DEPT).map(d=>`<option>${d}</option>`).join('');
document.querySelectorAll('input,select').forEach(e=>{e.addEventListener('input',render);e.addEventListener('change',render)});
function up(id,cb){$(id).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cb(r.result);render()};r.readAsDataURL(f)}}
up('upLogo',s=>logoSrc=s);up('upOC',s=>ocLogo=s);up('upNU',s=>nuSrc=s);up('upPhoto',s=>{if($('clg').value==='o')ocPhoto=s;else photoSrc=s});
$('th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
$('rs').onclick=()=>{try{localStorage.removeItem('rsh3')}catch(e){}location.reload()};
$('dl').onclick=async()=>{if(ADS_ON&&!await adGate())return;const b=$('dl');b.disabled=true;b.textContent='Generating PDF...';
 try{await document.fonts.ready;fitText();const c=$('pg').cloneNode(true);c.removeAttribute('id');c.style.cssText+=';transform:none;position:relative;box-shadow:none';
  const h=document.createElement('div');h.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1122px';h.appendChild(c);document.body.appendChild(h);
  const nm=($('name').value.trim()||'Student').replace(/[^\w\-]+/g,'_');
  await html2pdf().set({margin:0,filename:'Cover_'+nm+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,width:794,height:1122,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all']}}).from(c).save();h.remove()}
 catch(e){alert('PDF hocche na, page refresh kore abar try koro.');console.error(e)}
 b.disabled=false;b.innerHTML='&#11015; Download PDF'};
(function(){const d=new Date();$('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 try{const o=JSON.parse(localStorage.getItem('rsh3')||'null');if(o){tpl=o.tpl;[...document.querySelectorAll('input:not([type=file]),select')].forEach((e,i)=>{if(o.f[i]!==undefined){if(e.type==='checkbox')e.checked=o.f[i];else e.value=o.f[i]}})}else $('color').value=TPL[0].c1}catch(e){$('color').value=TPL[0].c1}
 [['logo.png',x=>logoSrc=x],['nu-logo.png',x=>nuSrc=x],['bg.jpg',x=>photoSrc=x]].forEach(a=>{const m=new Image();m.onload=()=>{const cur=a[0]==='logo.png'?logoSrc:a[0]==='nu-logo.png'?nuSrc:photoSrc;if(!cur){a[1](a[0]);render()}};m.src=a[0]});
 pick(tpl,false);fitP()})();
window.addEventListener('resize',fitP);window.addEventListener('load',fitP);
</script></body></html>
