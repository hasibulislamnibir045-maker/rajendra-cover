async function pdfRun(m){const fs=[...$('pf').files];if(!fs.length)return alert('আগে ফাইল বাছাই করুন');const {PDFDocument,degrees}=PDFLib;
 try{
 if(m==='i2p'){const d=await PDFDocument.create();for(const f of fs){const bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
  const im=await d.embedPng(await new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(r)))),W=595,H=842,k=Math.min(W/im.width,H/im.height,1);
  d.addPage([W,H]).drawImage(im,{x:(W-im.width*k)/2,y:(H-im.height*k)/2,width:im.width*k,height:im.height*k})}dlB(await d.save(),'Images.pdf')}
 else if(m==='merge'){const d=await PDFDocument.create();for(const f of fs){const s=await PDFDocument.load(await f.arrayBuffer());(await d.copyPages(s,s.getPageIndices())).forEach(p=>d.addPage(p))}dlB(await d.save(),'Merged.pdf')}
 else{const s=await PDFDocument.load(await fs[0].arrayBuffer());
  if(m==='rot'){s.getPages().forEach(p=>p.setRotation(degrees((p.getRotation().angle+90)%360)));dlB(await s.save(),'Rotated.pdf')}
  else{const ix=[];($('pr').value||'1').split(',').forEach(x=>{const[a,b]=x.split('-').map(Number);for(let i=a;i<=(b||a);i++)if(i>=1&&i<=s.getPageCount())ix.push(i-1)});
   const d=await PDFDocument.create();(await d.copyPages(s,ix)).forEach(p=>d.addPage(p));dlB(await d.save(),'Split.pdf')}}
 }catch(e){alert('ফাইল প্রসেস করা যায়নি। সঠিক ফাইল দিন।');console.error(e)}}
function libR(){const q=$('lq').value.toLowerCase(),d=$('ld').value;$('lr').innerHTML=RES.filter(r=>(!d||r.dept===d)&&(r.t+r.type+r.yr).toLowerCase().includes(q)).map(r=>`<div class="ex"><span><b>${esc(r.t)}</b><br><small style="color:var(--muted)">${esc(r.dept)} · ${esc(r.yr)} · ${esc(r.type)}</small></span><a class="ib" style="text-decoration:none;font-size:13px" href="${esc(r.u)}" target="_blank" rel="noopener">খুলুন</a></div>`).join('')||'<p style="color:var(--muted);font-size:13px">এখনো কিছু যোগ হয়নি</p>'}
