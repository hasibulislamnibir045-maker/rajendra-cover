<style>
:root{--gold:#3ddc84;--g:#0f7a3f;--bg:#04120a;--panel:rgba(5,26,15,.82);--line:rgba(61,220,132,.3);--text:#eaf7ef;--muted:#9fc4ad;--input:#082016}
:root[data-theme=light]{--gold:#0f7a3f;--bg:#eaf4ee;--panel:rgba(255,255,255,.92);--line:rgba(15,122,63,.3);--text:#10261a;--muted:#4f6b5b;--input:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;color:var(--text);background:var(--bg);position:relative}
body:before,body:after{content:"";position:fixed;top:0;bottom:0;z-index:-1;background-size:cover;background-position:center}
body:before{left:0;right:50%;background-image:linear-gradient(rgba(2,14,8,.72),rgba(2,14,8,.9)),url(bg.jpg)}
body:after{left:50%;right:0;background-image:linear-gradient(rgba(2,14,8,.72),rgba(2,14,8,.9)),url(bg2.jpg)}
:root[data-theme=light] body:before{background-image:linear-gradient(rgba(234,244,238,.88),rgba(234,244,238,.95)),url(bg.jpg)}
:root[data-theme=light] body:after{background-image:linear-gradient(rgba(234,244,238,.88),rgba(234,244,238,.95)),url(bg2.jpg)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:rgba(2,12,7,.9);border-bottom:2px solid #1fd16a;box-shadow:0 2px 18px rgba(31,209,106,.25);position:sticky;top:0;z-index:9;backdrop-filter:blur(6px)}
:root[data-theme=light] header{background:rgba(255,255,255,.95)}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.lg{width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid #3ddc84;box-shadow:0 0 14px rgba(61,220,132,.5);overflow:hidden;flex:none}
.lg img{width:100%;height:100%;object-fit:contain}
h1{font:700 20px 'Playfair Display',serif;color:#fff}:root[data-theme=light] h1{color:#0f7a3f}
.brand p{font-size:12px;color:var(--muted)}
.hb{display:flex;gap:10px;align-items:center}
.ib{background:none;border:1px solid var(--line);color:inherit;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:16px}
main{display:grid;grid-template-columns:420px minmax(0,1fr);gap:26px;max-width:1300px;margin:0 auto;padding:24px 18px 40px;align-items:start}
.panel{background:var(--panel);border:1px solid rgba(61,220,132,.45);border-radius:18px;padding:16px 18px;box-shadow:0 0 28px rgba(31,209,106,.15),0 10px 40px rgba(0,0,0,.4);backdrop-filter:blur(8px)}
h3{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
h3:before{content:"";width:4px;height:14px;background:#3ddc84;border-radius:2px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--gold)}input[type=color]{padding:2px;height:38px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tb{border:2px solid transparent;border-radius:10px;background:none;cursor:pointer;color:var(--text);font:600 10px Inter;padding:4px}
.tb i{display:block;height:44px;border-radius:7px;margin-bottom:3px;border:1px solid rgba(128,128,128,.4)}
.tb.on{border-color:#3ddc84}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font:700 15px Inter;cursor:pointer;margin-top:10px}
.pr{background:linear-gradient(135deg,#22d46d,#0fa352);color:#032010}
.gh{background:none;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.6}
#fit{position:relative;width:100%}
.page{width:794px;height:1122px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--ff),'Noto Serif Bengali',serif;box-shadow:0 12px 50px rgba(0,0,0,.45)}
.page>svg{position:absolute;left:0;top:0}
.ct{position:absolute;top:62px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.nu{display:flex;align-items:center;gap:12px;font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.nu .nl{width:50px;height:50px;flex:none}
.nu img,.nu svg{width:100%;height:100%;object-fit:contain}
.g{display:flex;flex-direction:column;align-items:center;width:100%}
.lw{width:170px;height:170px;display:grid;place-items:center}
.lw img,.lw svg{width:100%;height:100%;object-fit:contain}
.cn{font:700 34px/1.2 var(--ff),'Noto Serif Bengali',serif;color:var(--c1);margin-top:12px}
.sub{font-size:16px;margin-top:6px}
.rb{margin-top:4px;padding:8px 34px;background:var(--c1);color:var(--ht);font-weight:700;font-size:21px;border-radius:4px;border-bottom:3px solid var(--c2)}
.sm{font-size:16px;margin-top:6px}
.dt{padding:6px 40px;border:2px solid var(--c1);font:700 26px var(--ff),'Noto Serif Bengali',serif;letter-spacing:.12em;text-transform:uppercase;color:var(--c1)}
.tp{width:100%;height:150px;margin-top:12px;padding:10px 22px;display:flex;align-items:center;justify-content:center;border-top:1.5px solid var(--c2);border-bottom:1.5px solid var(--c2);font-weight:700;line-height:1.35;overflow:hidden}
.bx{display:flex;gap:18px;width:100%}
.b{flex:1;border:1.5px solid var(--c1);text-align:left}
.b h4{background:var(--c1);color:var(--ht);padding:6px 14px;font-size:15px;letter-spacing:.05em}
.b div{padding:9px 14px;font-size:15.5px;line-height:1.55}
.ft{font-weight:700;font-size:16px;padding:5px 26px;border-top:2px solid var(--c2);border-bottom:2px solid var(--c2)}
#adm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:99;align-items:center;justify-content:center;padding:18px}

/* ---- Developer card ---- */
.dev{max-width:1300px;margin:0 auto 34px;padding:26px 18px 22px;text-align:center;background:var(--panel);border:1px solid rgba(61,220,132,.45);border-radius:18px;position:relative;overflow:hidden}
.dev:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#3ddc84,#f3d98a,#3ddc84,transparent)}
.dev h4{font:600 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:12px}
.dev h4:before,.dev h4:after{content:"";width:46px;height:1px;background:var(--line)}
.dev .dn{font:700 28px/1.2 'Playfair Display',serif;margin:12px 0 10px;background:linear-gradient(90deg,#eaf7ef,#f3d98a 50%,#3ddc84);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme=light] .dev .dn{background:linear-gradient(90deg,#0f7a3f,#0a5a2e);-webkit-background-clip:text;background-clip:text}
.dev .dd{display:inline-block;padding:6px 18px;border-radius:999px;border:1px solid #3ddc84;background:rgba(61,220,132,.12);font:600 14px Inter;color:var(--text)}
.dev .dc{margin-top:8px;font:italic 400 15px 'Tinos',serif;color:var(--muted)}
.dl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.dl a{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);color:var(--text);text-decoration:none;font:600 13px Inter;background:rgba(128,128,128,.1)}
.dl a:hover{background:#0fa352;border-color:#3ddc84;color:#fff}
.cp{font-size:11px;color:var(--muted);margin-top:14px}

/* ---- Mobile: form + preview side by side on ONE screen (PSTU style) ---- */
@media(max-width:1000px){
 header{padding:6px 10px}
 .brand{gap:8px}.lg{width:34px;height:34px}
 h1{font-size:13px}.brand p{display:none}
 .ib{padding:4px 8px;font-size:12px}
 main{grid-template-columns:minmax(0,41%) minmax(0,59%);gap:8px;padding:8px 6px 20px}
 main>section:last-child{position:sticky;top:50px;align-self:start}
 .panel{padding:8px;border-radius:12px}
 h3{font-size:9px;margin:10px 0 4px;gap:5px}h3:before{width:3px;height:10px}
 label{font-size:9px;margin:6px 0 2px}
 input,select{padding:6px 6px;font-size:11px;border-radius:7px}
 input[type=color]{height:28px}
 input[type=file]{font-size:9px;padding:4px}
 .r{grid-template-columns:1fr;gap:0}
 .tg{grid-template-columns:1fr 1fr;gap:5px}
 .tb{font-size:8px;padding:2px}.tb i{height:24px;margin-bottom:2px}
 .btn{padding:9px 4px;font-size:11px;border-radius:9px;margin-top:7px}
 .page{box-shadow:0 4px 16px rgba(0,0,0,.45)}
 .dev{margin:0 6px 24px;padding:20px 10px 16px}
 .dev .dn{font-size:22px}.dev .dd{font-size:12px;padding:5px 14px}.dev .dc{font-size:13px}
}
</style></head><body>

 if(v('reg'))by+=`${T('reg')}: ${esc(bd(v('reg')))}<br>`;if(v('sid'))by+=`${T('sid')}: ${esc(bd(v('sid')))}<br>`;
 by+=esc(lvl)+`<br>${T('sess')}: ${esc(bd(v('sess')||'—'))}`;if(v('ph'))by+=`<br>${T('ph')}: ${esc(bd(v('ph')))}`;
 const lsrc=oth?ocLogo:logoSrc,lg=lsrc?`<img src="${lsrc}">`:crest(c1,t.c2);

 pg.innerHTML=deco(t,c1)+`<div class="ct" style="left:${left}px;right:${right}px;bottom:70px">

async function renderCanvas(){
 await document.fonts.ready;fitText();
 const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
 const fh=document.querySelector('link[href*="fonts.googleapis"]').href;
 const fr=document.createElement('iframe');
 fr.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1122px;border:0';
 document.body.appendChild(fr);
 try{
  const d=fr.contentDocument;d.open();
  d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><link href="'+fh+'" rel="stylesheet"><style>'+css+'\nhtml,body{margin:0!important;padding:0!important;background:#fff!important;width:794px;height:1122px;overflow:hidden}body:before,body:after{display:none!important}.page{position:relative!important;left:0!important;top:0!important;transform:none!important;box-shadow:none!important}</style></head><body>'+$('pg').outerHTML+'</body></html>');
  d.close();
  await new Promise(r=>{if(d.readyState==='complete')r();else fr.onload=()=>r();setTimeout(r,1500)});
  await d.fonts.ready;
  await Promise.all([...d.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  await new Promise(r=>setTimeout(r,250));
  return await html2canvas(d.querySelector('.page'),{scale:2,useCORS:true,width:794,height:1122,windowWidth:794,windowHeight:1122,x:0,y:0,scrollX:0,scrollY:0,backgroundColor:null});
 }finally{fr.remove()}}
async function download(kind){
 if(ADS_ON&&!await adGate())return;
 const b=kind==='pdf'?$('dl'):$('dli'),old=b.innerHTML;b.disabled=true;b.textContent=kind==='pdf'?'Generating PDF...':'Generating image...';
 try{
  const cv=await renderCanvas();
  const nm=($('name').value.trim()||'Student').replace(/[^\w\-]+/g,'_');
  if(kind==='pdf'){
   const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
   pdf.addImage(cv.toDataURL('image/jpeg',.98),'JPEG',0,0,210,297);pdf.save('Cover_'+nm+'.pdf');
  }else{
   await new Promise(res=>cv.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='Cover_'+nm+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);res()},'image/png'));
  }
 }catch(e){alert('Download hocche na, page refresh kore abar try koro.');console.error(e)}
 b.disabled=false;b.innerHTML=old}

 if(!restored)$('color').value=TPL[0].c1;

 pick(tpl,false)})();
