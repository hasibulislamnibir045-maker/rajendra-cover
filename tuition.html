<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuition Hub — Rajendra Student Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-ui.css?v=5">
<style>
:root{--bg:#faf7f2;--text:#2a1f14;--muted:#7a6a58;--line:#eadfce;--g:#e06a0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,'Noto Serif Bengali',sans-serif;color:var(--text);background:var(--bg);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
.brand{display:flex;gap:12px;align-items:center}
.lg{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--g);overflow:hidden;flex:none}
.lg img{width:100%;height:100%;object-fit:contain}
h1{font:700 18px 'Noto Serif Bengali',serif;color:#2a1f14}
.brand p{font-size:11px;color:var(--muted)}
.hbtns{display:flex;gap:8px;align-items:center}
.ib{background:none;border:1px solid var(--line);color:inherit;border-radius:8px;padding:7px 12px;cursor:pointer;font:600 13px Inter;text-decoration:none}
.ib:hover{border-color:var(--g)}
.hero{max-width:1100px;margin:0 auto;padding:40px 18px 18px;text-align:center}
.hero h2{font:800 30px/1.3 Inter,'Noto Serif Bengali';color:#2a1f14}
.hero h2 em{font-style:normal;color:var(--g)}
.hero p{color:var(--muted);font-size:15px;margin-top:10px}
.stats{display:flex;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 22px;min-width:130px;box-shadow:0 1px 6px rgba(80,50,10,.08)}
.stat b{display:block;font-size:24px;color:var(--g)}
.stat span{font-size:12px;color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding:10px 18px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.grid .hub-card{margin:0}
.grid .hub-card:hover{transform:translateY(-2px)}
footer{border-top:1px solid var(--line);padding:18px;text-align:center;color:var(--muted);font-size:12px;background:#fff}
@media(max-width:640px){.hero h2{font-size:22px}}
</style>
</head>
<body>
<header>
<div class="brand">
<div class="lg"><img src="logo.png" alt="" onerror="this.style.display='none'"></div>
<div><h1>Tuition Hub</h1><p>Rajendra Student Hub</p></div>
</div>
<div class="hbtns">
<a class="ib" href="index.html">&#11088; Student Hub</a>
<button class="ib" id="authBtn" onclick="authClick()">&#128273; <span id="authLbl">Login</span></button>
</div>
</header>
<section class="hero">
<h2 id="heroH">Tuition Hub</h2>
<p id="heroP"></p>
<div class="stats">
<div class="hub-stat-like stat"><b id="stT">0</b><span id="stTL"></span></div>
<div class="stat"><b id="stP">0</b><span id="stPL"></span></div>
</div>
</section>
<main class="wrap" id="app"><p class="hub-empty" id="loadLbl">Loading...</p></main>
<footer>&copy; Rajendra Student Hub &middot; Tuition Hub</footer>
